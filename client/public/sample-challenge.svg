<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Main Frame -->
  <rect x="60" y="60" width="1080" height="680" rx="20" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  
  <!-- Category Pill -->
  <rect x="100" y="100" width="340" height="40" rx="20" fill="url(#badge)"/>
  <text x="120" y="126" font-family="Inter, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    BRIEF2BUILD AI • CHALLENGE SPEC
  </text>

  <!-- Title -->
  <text x="100" y="190" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff">
    Challenge: EcoRoute AI — Sustainable Mobility Platform
  </text>
  <text x="100" y="225" font-family="Inter, sans-serif" font-size="17" fill="#94a3b8">
    Build a focused, high-reliability prototype analyzing transit data to optimize travel time and carbon emissions.
  </text>

  <!-- Separator -->
  <line x1="100" y1="260" x2="1100" y2="260" stroke="#1e293b" stroke-width="2"/>

  <!-- Core Requirements Box -->
  <rect x="100" y="290" width="480" height="375" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="120" y="325" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">
    Core Requirements &amp; Deliverables
  </text>
  <text x="120" y="365" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">1. Meaningfully integrate Gemma 4 through the Gemini API</text>
  <text x="120" y="405" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">2. Ingest transit screenshots or commute schedules</text>
  <text x="120" y="445" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">3. Extract explicit constraints with visual citations</text>
  <text x="120" y="485" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">4. Build one focused user story with interactive prototype</text>
  <text x="120" y="525" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">5. Calculate comparative carbon savings across transit modes</text>
  <text x="120" y="565" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">6. Deploy a working version to cloud web service with /health</text>
  <text x="120" y="605" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">7. Zero exposed API keys, secrets, or committed credentials</text>

  <!-- Rules & Constraints Box -->
  <rect x="620" y="290" width="480" height="375" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="640" y="325" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#f59e0b">
    Constraints &amp; Rules
  </text>
  <text x="640" y="365" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Development Window: 24-hour sprint</text>
  <text x="640" y="405" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Do NOT train a model; use supported existing API</text>
  <text x="640" y="445" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Keep stack lean: React + Vite + Node/Express</text>
  <text x="640" y="485" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Separate visual ground truth from AI recommendations</text>
  <text x="640" y="525" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• No database or payment gateway bloat</text>
  <text x="640" y="565" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Provide an editable team checklist and exportable plan</text>
  <text x="640" y="605" font-family="Inter, sans-serif" font-size="14" fill="#34d399">• Strict privacy: process images in memory, zero disk retention</text>

  <!-- Reference Documentation Bar -->
  <rect x="100" y="680" width="1000" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="705" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#60a5fa">
    Documentation: https://ai.google.dev/gemma
  </text>
</svg>
