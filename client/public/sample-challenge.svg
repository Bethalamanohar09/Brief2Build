<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Header Card -->
  <rect x="60" y="60" width="1080" height="680" rx="20" fill="#090d16" stroke="#334155" stroke-width="2"/>
  
  <!-- Category Pill -->
  <rect x="100" y="100" width="360" height="40" rx="20" fill="url(#badge)"/>
  <text x="120" y="126" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">
    HACKTOBERFEST HACK DAY 2026
  </text>

  <!-- Title -->
  <text x="100" y="190" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff">
    Challenge: Best Use of Gemma 4
  </text>
  <text x="100" y="225" font-family="Inter, sans-serif" font-size="18" fill="#94a3b8">
    Build a focused, functional prototype that makes creative, multimodal use of Gemma 4 via Gemini API.
  </text>

  <!-- Separator -->
  <line x1="100" y1="260" x2="1100" y2="260" stroke="#1e293b" stroke-width="2"/>

  <!-- Core Requirements Box -->
  <rect x="100" y="290" width="480" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="120" y="325" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">
    Core Requirements &amp; Deliverables
  </text>
  <text x="120" y="365" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Meaningfully use Gemma 4 through the Gemini API</text>
  <text x="120" y="405" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Must process multimodal input (images &amp; screenshots)</text>
  <text x="120" y="445" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Build one focused experience with one clear user story</text>
  <text x="120" y="485" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Provide an end-to-end working prototype (no mock demos)</text>
  <text x="120" y="525" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Deploy a working version to Render Web Service</text>
  <text x="120" y="565" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Publish public GitHub repo with MIT License</text>
  <text x="120" y="605" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Zero exposed API keys, secrets, or committed credentials</text>

  <!-- Rules & Constraints Box -->
  <rect x="620" y="290" width="480" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="640" y="325" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#f59e0b">
    Judging Constraints &amp; Rules
  </text>
  <text x="640" y="365" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Deadline: 24-hour sprint window</text>
  <text x="640" y="405" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Do NOT train a model; use supported existing API</text>
  <text x="640" y="445" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Must make Gemma value obvious in first 30s of demo</text>
  <text x="640" y="485" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Keep stack lean: React + Vite + Node/Express on Render</text>
  <text x="640" y="525" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Separate visual ground truth from AI recommendations</text>
  <text x="640" y="565" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">• Prepare a 2-minute concise pitch video</text>
  <text x="640" y="605" font-family="Inter, sans-serif" font-size="14" fill="#f87171">• Disqualification: Hardcoded fake data presented as live model</text>
</svg>
